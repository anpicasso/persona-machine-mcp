name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen python -X dev -m pytest -q
      - run: uv build
      - name: Smoke-test the built wheel
        run: uvx --from ./dist/persona_machine_mcp-*.whl persona-machine-mcp --version
